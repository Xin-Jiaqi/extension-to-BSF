name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            getCIFs.py \
            "lattice info--oblique.py" \
            "lattice info--rectangular.py" \
            scan_energy/pos2opt.py

      - name: Check Bash syntax
        run: bash -n scan_energy/*.sh
